name: Build macOS Installer

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up natID SDK Dependencies
      run: |
        # Create the SDK directory in the runner's home folder
        mkdir -p ~/natID.SDK
        # Clone the natID framework repository directly into the expected path
        git clone https://github.com/idzafic/natID.git ~/natID.SDK

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCPACK_GENERATOR=DragNDrop

    - name: Build Application
      run: |
        cmake --build build --config Release

    - name: Generate DMG Installer via CPack
      run: |
        cd build
        cpack
        
    - name: Upload Mac Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConnectXO-Mac-Installer
        path: build/*.dmg