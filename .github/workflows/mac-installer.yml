name: Build macOS Installer

on:
  workflow_dispatch: # Allows you to manually trigger this from the GitHub website

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up natID SDK Dependencies
      run: |
        # Replicates your local SDK folder structure on the Mac cloud server
        mkdir -p ~/natID.SDK
        # Clone or copy your required natID framework binaries/scripts here
        # Example: git clone https://github.com/idzafic/natID.git ~/natID.SDK
        
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCPACK_GENERATOR=DragNDrop

    - name: Build Application
      run: |
        cmake --build build --config Release

    - name: Generate DMG Installer via CPack
      run: |
        cd build
        cpack

    - name: Upload Mac Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConnectXO-Mac-Installer
        path: build/*.dmg